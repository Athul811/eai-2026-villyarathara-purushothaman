openapi: 3.0.3
info:
  title: Checkout Orchestration API
  version: 1.0.0
  description: >-
    Turns one canonical order into one business transaction. A single call to
    POST /checkout charges the customer, reserves stock, creates a shipment and
    sends a confirmation, strictly in that order. If a step fails or times out,
    the steps that already completed and have an undo action (payment and
    inventory) are rolled back in reverse order before the answer is returned.
    Retrying with the same Idempotency-Key never runs the transaction twice.
  contact:
    name: Athul811
servers:
  - url: http://localhost:3000
    description: Local orchestrator started with docker compose.
tags:
  - name: Checkout
    description: Running the checkout transaction for an order.
  - name: Operations
    description: Liveness and other operational endpoints.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Tells a caller whether the orchestrator process is up and able to accept requests.
      tags: [Operations]
      responses:
        "200":
          description: The orchestrator is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      summary: Run the checkout transaction for one order
      description: >-
        Runs payment, inventory, shipping and notification one after another
        for the order in the request body. The amount charged is the sum of
        unitPrice times quantity over the items, and the confirmation goes to
        customer.email. A call that exceeds the downstream timeout counts as a
        failed step. When the same Idempotency-Key and the same body are sent
        again after the transaction finished, the original status code and
        body are returned and nothing runs a second time.
      tags: [Checkout]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Caller-chosen key that identifies one logical checkout. Reusing it
            with an identical body replays the first result. Reusing it with a
            different body is rejected, and so is reusing it while the first
            request is still running.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        description: >-
          The order to check out, in the canonical order format. It holds at
          most 100 line items.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: All four steps succeeded, or an identical earlier request is being replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: The Idempotency-Key header is missing, or the body is not a valid canonical order (including more than 100 items).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The key was already used for a different body, or a request with this key is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A step was refused downstream. The saga status is compensated when
            the rollback worked, or failed with code compensation_failed when a
            rollback call itself failed, or failed when payment was refused and
            there was nothing to undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "504":
          description: A downstream call did not answer within the request timeout. Completed steps were rolled back where an undo action exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "500":
          description: The orchestrator hit an unexpected internal error. The idempotency key is released, so the same request can be retried with the same Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      description: Minimal liveness payload.
      required: [status]
      properties:
        status:
          type: string
          description: Always ok while the process can serve requests.
          enum: [ok]
    Address:
      type: object
      description: Delivery address of the customer.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street and house number.
          minLength: 1
        city:
          type: string
          description: City or town.
          minLength: 1
        postalCode:
          type: string
          description: Postal code in the format of the destination country.
          minLength: 1
        country:
          type: string
          description: Two-letter country code.
    Customer:
      type: object
      description: The customer who placed the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Full name of the customer.
          minLength: 1
        email:
          type: string
          description: Address that receives the confirmation notification.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: One priced line on the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product identifier in PROD-number form.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Human-readable product name.
          minLength: 1
        quantity:
          type: integer
          description: Number of units ordered.
          minimum: 1
        unitPrice:
          type: string
          description: Price of one unit as a decimal string with exactly two fraction digits. Never a JSON number.
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          description: Currency of unitPrice.
        taxRate:
          type: number
          description: Tax rate as a fraction between 0 and 1.
          minimum: 0
          maximum: 1
    CanonicalOrder:
      type: object
      description: >-
        The canonical order, restated here because the canonical schema leaves
        its items array unbounded and this contract must not. The only
        difference is the upper limit of 100 on items, which the service
        enforces.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order id as assigned by the source system.
          minLength: 1
        orderType:
          type: string
          description: Business type of the order.
          enum: [standard, express, b2b]
        source:
          type: string
          description: Which source system produced the order.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          description: When the canonical record was produced.
          format: date-time
        orderDate:
          type: string
          description: The order's own timestamp in UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: Line items on the order, between 1 and 100.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Currency of the order as a whole.
        status:
          type: string
          description: Order status when the order was accepted.
          enum: [new, processing, shipped, delivered]
    TraceItem:
      type: object
      description: One call the saga made, recorded in the order it was made.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: Which call this was, including the two rollback calls.
          enum: [payment, inventory, shipping, notification, inventory_release, payment_refund]
        status:
          type: string
          description: How the call ended.
          enum: [success, failed, timeout]
        startedAt:
          type: string
          description: When the call began, as an ISO-8601 timestamp.
          format: date-time
        finishedAt:
          type: string
          description: When the call ended, as an ISO-8601 timestamp.
          format: date-time
        durationMs:
          type: integer
          description: Elapsed time of the call in whole milliseconds.
          minimum: 0
    CheckoutResponse:
      type: object
      description: Outcome of running the checkout saga for one order.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The orderId from the request.
          minLength: 1
        status:
          type: string
          description: Final state of the saga.
          enum: [completed, failed, compensated]
        code:
          type: string
          description: Machine-readable reason, present unless the saga completed. It is the downstream code, timeout, or compensation_failed.
        trace:
          type: array
          description: Every call the saga made in order. At most six, since four steps and two rollbacks are the most that can happen.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceItem"
    ErrorResponse:
      type: object
      description: Error body for rejected requests.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum: [validation_error, idempotency_payload_mismatch, idempotency_conflict, internal_error]
        message:
          type: string
          description: Human-readable explanation for a developer.
          minLength: 1
